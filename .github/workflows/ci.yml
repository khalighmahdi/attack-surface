name: CI + Kali Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install requests dnspython PyYAML idna pysocks msgpack
    - name: Unit tests (full suite)
      run: python -m unittest discover -s tests -v
    - name: CLI smoke (--help)
      run: python attack_surface.py --help > /dev/null
    - name: Entrypoint passthrough smoke
      run: bash entrypoint.sh --help > /dev/null

  build-deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build .deb (Kali/Debian)
      run: python3 build_deb.py
    - name: Verify package
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq lintian dpkg-dev || true
        dpkg-deb -I attack-surface_*_all.deb
        dpkg-deb -c attack-surface_*_all.deb | head -20
    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: attack-surface-deb
        path: attack-surface_*_all.deb

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build docker image
      run: |
        docker build -q -t attack-surface:ci .
        docker run --rm attack-surface:ci --help
    - name: Verify image size
      run: docker images attack-surface:ci --format "{{.Size}}"