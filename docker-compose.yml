# attack-surface team stack: tools container + dashboard + optional daemons
#
# Usage:
#   docker compose up -d kali dashboard      → UI on http://127.0.0.1:8443
#   docker compose --profile services up -d  → also msfrpcd+sliver (loopback-only on host)
#   docker compose --profile watch up -d watch
#       → scheduled diff-scan + TG alerts (set TARGET/EVERY/TG_TOKEN/TG_CHAT)
#
# Security posture:
#   - msfrpcd/sliver ports publish on 127.0.0.1 ONLY (never 0.0.0.0)
#   - msfrpcd runs with SSL and a per-boot random password
#     (written to ./deploy-state/msfrpcd.env, chmod 600)
version: "3.8"

services:
  # Tool container: hydra/sqlmap/wpscan/nuclei-class tools + sliver + msfconsole.
  # Action Center and terminal sessions execute INSIDE this container.
  # Uses the same image as the scanner (full toolset baked in at build).
  kali:
    build: .
    image: attack-surface-tools
    container_name: kali-as
    # override entrypoint: this container idles, it doesn't run the CLI
    entrypoint: ["sleep", "infinity"]
    volumes:
      - as-db:/root/.attack_surface
    restart: unless-stopped

  dashboard:
    build: .
    container_name: attack-surface-dashboard
    command: ["serve", "--port", "8443", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      - KALI_CONTAINER=kali-as
    volumes:
      - ./reports:/home/attack/attack-surface/reports
      - as-db:/home/attack/.attack_surface
      # Action Center / terminal sessions exec into the kali-as tool
      # container; the socket gives the dashboard docker CLI access.
      # Equivalent to root on this host — run only on operator machines.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - kali
    restart: unless-stopped

  # Service mode (no args) → msfrpcd (SSL, random pass) + sliver server.
  # Publishes on host loopback only; red-team RPC clients connect to
  # 127.0.0.1:55553 / 127.0.0.1:50051 with creds from ./deploy-state/msfrpcd.env
  services:
    build: .
    container_name: attack-surface-run
    environment:
      - MSF_BIND=0.0.0.0
      - SLIVER_BIND=0.0.0.0
      - ATTACK_SURFACE_STATE=/state
    ports:
      - "127.0.0.1:55553:55553"
      - "127.0.0.1:50051:50051"
    volumes:
      - ./deploy-state:/state
    profiles: ["services"]
    restart: unless-stopped

  watch:
    build: .
    container_name: attack-surface-watch
    command: ["watch", "-d", "${TARGET:-example.com}", "--every", "${EVERY:-21600}", "--tg-alert"]
    environment:
      - TG_TOKEN=${TG_TOKEN:-}
      - TG_CHAT=${TG_CHAT:-}
      - TARGET=${TARGET:-example.com}
      - EVERY=${EVERY:-21600}
      - KALI_CONTAINER=kali-as
    volumes:
      - ./reports:/home/attack/attack-surface/reports
      - as-db:/home/attack/.attack_surface
    profiles: ["watch"]
    restart: unless-stopped

volumes:
  as-db:
