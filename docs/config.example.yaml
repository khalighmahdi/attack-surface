# ~/.config/attack-surface/config.yaml
# Attack Surface Scanner - user defaults
# CLI flags always override these values.

# domain: example.com      # optional default target
rate: 5
no-ports: false           # skip nmap (mobile/slow networks)
cves-deep: true           # CPE-exact CVE matching
poc: false                # safe active probes (TLS/login/AXFR)

