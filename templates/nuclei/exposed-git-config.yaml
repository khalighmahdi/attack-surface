id: attack-surface-exposed-git-config
info:
  name: Exposed .git/config
  author: khalighmahdi
  severity: high
  description: Git repository configuration is publicly readable
  tags: exposure,git
http:
  - method: GET
    path: ["{{BaseURL}}/.git/config"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["[core]", "repositoryformatversion"]
        condition: and
